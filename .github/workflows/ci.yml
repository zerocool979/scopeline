name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: backend}}
    services:
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_PASSWORD: postgres}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: sudo apt-get update && sudo apt-get install -y libreoffice-writer
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests
      - run: bandit -q -r app
      - run: pip-audit -r requirements.txt
      - name: Tes (SQLite) + cakupan
        run: pytest --cov=app --cov-fail-under=70
      - name: Tes (PostgreSQL) - migrasi & relasi pada mesin sebenarnya
        env: {TEST_DATABASE_URL: "postgresql+psycopg://postgres:postgres@localhost:5432/postgres"}
        run: pytest -q
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements-dev.txt}
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - run: pip install -r backend/requirements-dev.txt
      - run: cd e2e && npm install --no-audit --no-fund && npm test
  docker:
    runs-on: ubuntu-latest
    needs: [test, e2e]
    steps:
      - uses: actions/checkout@v7
      - run: docker compose build
